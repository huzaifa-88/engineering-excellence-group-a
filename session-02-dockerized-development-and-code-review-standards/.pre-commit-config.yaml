repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -c "cd session-02-dockerized-development-and-code-review-standards && uv run ruff check --fix"
        language: system
        files: ^session-02-dockerized-development-and-code-review-standards/.*\.py$

      - id: ruff-format
        name: ruff-format
        entry: bash -c "cd session-02-dockerized-development-and-code-review-standards && uv run ruff format"
        language: system
        files: ^session-02-dockerized-development-and-code-review-standards/.*\.py$

      - id: mypy
        name: mypy
        entry: bash -c "cd session-02-dockerized-development-and-code-review-standards && uv run mypy app"
        language: system
        pass_filenames: false
       
      - id: pytest
        name: pytest
        entry: bash -c "cd session-02-dockerized-development-and-code-review-standards && uv run pytest"
        language: system
        pass_filenames: false
        